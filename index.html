<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>挑战永不停歇</title>
  <style>
    :root {
      --bg-color: #0b0b0f;
      --card-bg: #16161f;
      --accent-green: #10b981;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 16px env(safe-area-inset-bottom, 20px) 16px;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      padding-top: 5px;
    }

    .status-badge {
      display: inline-block;
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-green);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 15px;
    }

    .metrics-container {
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 100%;
      margin-bottom: 10px;
    }

    .metric-box {
      text-align: center;
    }

    .metric-label {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .metric-value {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .speed-info {
      text-align: center;
      font-size: 15px;
      color: var(--text-muted);
      margin-bottom: 15px;
    }

    .speed-info span {
      color: var(--accent-green);
      font-weight: 600;
    }

    /* 赛道与竞技展示区 */
    .track-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 15px;
    }

    .track-item {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px 14px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      position: relative;
    }

    .track-info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .track-title {
      font-weight: 500;
    }

    .track-range {
      color: var(--text-muted);
    }

    /* 赛道条样式 */
    .track-bar-container {
      height: 14px;
      background: #27272a;
      border-radius: 7px;
      position: relative;
      overflow: visible;
      margin: 6px 0 2px 0;
    }

    /* 核心修改：通过 scaleX(-1) 将图标水平翻转，让它们正面朝右向前奔跑/行驶 */
    .racer-icon {
      position: absolute;
      top: -12px;
      transform: translateX(-50%) scaleX(-1);
      font-size: 18px;
      transition: left 0.4s ease;
      z-index: 3;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    /* 底部按钮控制区 */
    .control-area {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-primary {
      width: 100%;
      background-color: var(--accent-green);
      color: #000;
      border: none;
      border-radius: 16px;
      padding: 18px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
    }

    .btn-primary:active {
      transform: scale(0.98);
      background-color: #059669;
    }

    .btn-primary:disabled {
      background-color: #374151;
      color: #9ca3af;
      cursor: not-allowed;
    }

    .btn-group {
      display: flex;
      gap: 12px;
    }

    .btn-secondary {
      flex: 1;
      background-color: #27272a;
      color: var(--text-main);
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      touch-action: manipulation;
    }

    .btn-secondary:active {
      background-color: #3f3f46;
    }
  </style>
</head>
<body>

  <header>
    <div id="statusBadge" class="status-badge">准备就绪 (0.0 km)</div>
    
    <div class="metrics-container">
      <div class="metric-box">
        <div class="metric-label">已跑时间</div>
        <div id="elapsedTime" class="metric-value">00:00</div>
      </div>
      <div class="metric-box">
        <div class="metric-label">预计总用时</div>
        <div id="estimatedTime" class="metric-value">--:--</div>
      </div>
    </div>

    <div class="speed-info">
      目前平均速度: <span id="speedDisplay">0.00 km/h</span> (<span id="paceDisplay">--'--"/km</span>)
    </div>
  </header>

  <!-- 6公里分段及运动员/赛车竞技场 -->
  <div class="track-list" id="trackList"></div>

  <div class="control-area">
    <button id="actionBtn" class="btn-primary" onclick="handlePunch()">到了！打卡下一个500米</button>
    <div class="btn-group">
      <button class="btn-secondary" onclick="resetWorkout()">清零</button>
      <button id="pauseBtn" class="btn-secondary" onclick="togglePause()">暂停跑步</button>
    </div>
  </div>

<script>
  const TOTAL_DISTANCE = 6.0; 
  const STEP_DISTANCE = 0.5;  
  
  let currentKm = 0;          
  let startTime = null;       
  let elapsedSeconds = 0;     
  let timerInterval = null;   
  let isRunning = false;      
  let isPaused = false;       
  let wakeLock = null;        

  const tracks = [
    { name: "第 1 公里", start: 0, end: 1 },
    { name: "第 2 公里", start: 1, end: 2 },
    { name: "第 3 公里", start: 2, end: 3 },
    { name: "第 4 公里", start: 3, end: 4 },
    { name: "第 5 公里", start: 4, end: 5 },
    { name: "第 6 公里 (冲刺)", start: 5, end: 6 }
  ];

  function renderTracks() {
    const listEl = document.getElementById('trackList');
    listEl.innerHTML = '';
    
    // 35分钟跑完6公里 = 2100秒
    const carTotalSeconds = isRunning || elapsedSeconds > 0 ? elapsedSeconds : 0;
    const carDistance = Math.min(carTotalSeconds * (6.0 / 2100), TOTAL_DISTANCE);

    tracks.forEach((track) => {
      let runnerPct = 0;
      let showRunner = false;
      
      if (currentKm >= track.end) {
        runnerPct = 100;
        showRunner = true;
      } else if (currentKm > track.start && currentKm < track.end) {
        runnerPct = ((currentKm - track.start) / (track.end - track.start)) * 100;
        showRunner = true;
      } else if (currentKm === track.start && track.start === 0 && (isRunning || elapsedSeconds > 0)) {
        runnerPct = 0;
        showRunner = true;
      }

      let carPct = 0;
      let showCar = false;
      
      if (carDistance >= track.end) {
        carPct = 100;
        showCar = true;
      } else if (carDistance > track.start && carDistance < track.end) {
        carPct = ((carDistance - track.start) / (track.end - track.start)) * 100;
        showCar = true;
      } else if (carDistance === track.start && track.start === 0 && (isRunning || elapsedSeconds > 0)) {
        carPct = 0;
        showCar = true;
      }

      const div = document.createElement('div');
      div.className = 'track-item';
      div.innerHTML = `
        <div class="track-info-row">
          <span class="track-title">${track.name}</span>
          <span class="track-range">${track.start}k - ${track.end}k</span>
        </div>
        <div class="track-bar-container">
          ${showRunner ? `<div class="racer-icon" style="left: ${runnerPct}%" title="运动员(你)">🏃</div>` : ''}
          ${showCar ? `<div class="racer-icon" style="left: ${carPct}%; font-size: 16px;" title="35分钟蓝色赛车">🏎️</div>` : ''}
        </div>
      `;
      listEl.appendChild(div);
    });
  }

  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
      }
    } catch (err) {
      console.warn('Wake Lock 申请失败:', err);
    }
  }

  function releaseWakeLock() {
    if (wakeLock !== null) {
      wakeLock.release().catch(() => {});
      wakeLock = null;
    }
  }

  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible' && isRunning && !isPaused) {
      await requestWakeLock();
    }
  });

  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      if (!isPaused && isRunning) {
        elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
        updateTimerDisplayOnly();
        renderTracks(); 
      }
    }, 1000);
  }

  function handlePunch() {
    if (navigator.vibrate) navigator.vibrate(50);

    if (!isRunning && !isPaused) {
      isRunning = true;
      startTime = Date.now();
      elapsedSeconds = 0;
      requestWakeLock();
      startTimer();
    }

    if (currentKm < TOTAL_DISTANCE) {
      currentKm = Math.min(currentKm + STEP_DISTANCE, TOTAL_DISTANCE);
    }

    triggerCalculation();

    if (currentKm >= TOTAL_DISTANCE) {
      isRunning = false;
      releaseWakeLock();
      clearInterval(timerInterval);
      document.getElementById('statusBadge').innerText = "🎉 挑战完成！";
      document.getElementById('actionBtn').innerText = "已完成全部 6 公里";
      document.getElementById('actionBtn').disabled = true;
    }
  }

  function updateTimerDisplayOnly() {
    const mins = Math.floor(elapsedSeconds / 60).toString().padStart(2, '0');
    const secs = (elapsedSeconds % 60).toString().padStart(2, '0');
    document.getElementById('elapsedTime').innerText = `${mins}:${secs}`;
  }

  function triggerCalculation() {
    updateTimerDisplayOnly();

    if (currentKm > 0 && elapsedSeconds > 0) {
      const speed = currentKm / (elapsedSeconds / 3600);
      document.getElementById('speedDisplay').innerText = `${speed.toFixed(2)} km/h`;

      const paceTotalSec = elapsedSeconds / currentKm;
      const paceMin = Math.floor(paceTotalSec / 60);
      const paceSec = Math.floor(paceTotalSec % 60).toString().padStart(2, '0');
      document.getElementById('paceDisplay').innerText = `${paceMin}'${paceSec}"/km`;

      const remainingKm = TOTAL_DISTANCE - currentKm;
      const remainingSeconds = speed > 0 ? (remainingKm / speed) * 3600 : 0;
      const estTotalSec = elapsedSeconds + remainingSeconds;

      const estMin = Math.floor(estTotalSec / 60).toString().padStart(2, '0');
      const estSec = Math.floor(estTotalSec % 60).toString().padStart(2, '0');
      document.getElementById('estimatedTime').innerText = `${estMin}:${estSec}`;

      document.getElementById('statusBadge').innerText = `打卡成功 (${currentKm.toFixed(1)} km)`;
    }
    renderTracks();
  }

  function togglePause() {
    if (!isRunning && elapsedSeconds === 0) return;

    isPaused = !isPaused;
    const pauseBtn = document.getElementById('pauseBtn');
    
    if (isPaused) {
      isRunning = false;
      releaseWakeLock();
      pauseBtn.innerText = "继续跑步";
      document.getElementById('statusBadge').innerText = `已暂停 (${currentKm.toFixed(1)} km)`;
    } else {
      isRunning = true;
      startTime = Date.now() - (elapsedSeconds * 1000);
      requestWakeLock();
      pauseBtn.innerText = "暂停跑步";
      triggerCalculation();
    }
    renderTracks();
  }

  function resetWorkout() {
    isRunning = false;
    isPaused = false;
    currentKm = 0;
    elapsedSeconds = 0;
    startTime = null;
    if (timerInterval) clearInterval(timerInterval);
    releaseWakeLock();

    document.getElementById('statusBadge').innerText = "准备就绪 (0.0 km)";
    document.getElementById('elapsedTime').innerText = "00:00";
    document.getElementById('estimatedTime').innerText = "--:--";
    document.getElementById('speedDisplay').innerText = "0.00 km/h";
    document.getElementById('paceDisplay').innerText = "--'--\"/km";
    document.getElementById('actionBtn').innerText = "到了！打卡下一个500米";
    document.getElementById('actionBtn').disabled = false;
    document.getElementById('pauseBtn').innerText = "暂停跑步";
    
    renderTracks();
  }

  renderTracks();
</script>
</body>
</html>
