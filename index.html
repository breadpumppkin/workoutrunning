<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>挑战永不停歇</title>
  <style>
    :root {
      --bg-color: #08080c;
      --card-bg: linear-gradient(135deg, #13131a 0%, #1a1a24 100%);
      --accent-blue: #3b82f6;       
      --accent-blue-glow: rgba(59, 130, 246, 0.25);
      --accent-yellow: #f59e0b;     
      --accent-yellow-glow: rgba(245, 158, 11, 0.2);
      --accent-green: #10b981;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 16px env(safe-area-inset-bottom, 24px) 16px;
      overflow-x: hidden;
      background-image: radial-gradient(circle at 50% 0%, #18182b 0%, transparent 70%);
    }

    /* 顶部状态与数据面板区 */
    header {
      text-align: center;
    }

    .status-badge {
      display: inline-block;
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: var(--accent-blue);
      padding: 5px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 12px;
    }

    .metrics-container {
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 100%;
      margin-bottom: 10px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 14px 10px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .metric-box {
      text-align: center;
      flex: 1;
    }

    .metric-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .metric-value {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 1px;
      font-variant-numeric: tabular-nums;
    }

    .speed-info {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .speed-info span {
      color: var(--accent-blue);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    /* 中间赛道展示区 */
    .track-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }

    .track-item {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 14px;
      border: 1px solid var(--border-color);
      position: relative;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .track-item.completed {
      border-color: rgba(59, 130, 246, 0.25);
      box-shadow: 0 4px 20px var(--accent-blue-glow);
    }

    .track-item.pending {
      border-color: rgba(245, 158, 11, 0.15);
      opacity: 0.85;
    }

    .track-info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .track-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .track-title {
      font-weight: 600;
      font-size: 14px;
      color: #e5e7eb;
    }

    .track-item.completed .track-title {
      color: var(--accent-blue);
    }
    .track-item.pending .track-title {
      color: var(--accent-yellow);
    }

    .track-range {
      color: var(--text-muted);
      font-size: 11px;
      background: rgba(255, 255, 255, 0.05);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .track-lap-time {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent-blue);
      font-variant-numeric: tabular-nums;
      background: rgba(59, 130, 246, 0.1);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .track-lap-time.empty {
      color: #4b5563;
      background: transparent;
      font-weight: 400;
      font-size: 12px;
      padding: 0;
    }

    .track-bar-container {
      height: 14px;
      background: #0d0d12;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 7px;
      position: relative;
      overflow: visible;
      margin: 6px 0 2px 0;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
    }

    .track-progress-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      border-radius: 6px;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .track-item.completed .track-progress-fill {
      background: rgba(59, 130, 246, 0.35);
    }
    .track-item.pending .track-progress-fill {
      background: rgba(245, 158, 11, 0.15);
    }

    .racer-icon {
      position: absolute;
      top: -11px;
      transform: translateX(-50%) scaleX(-1);
      font-size: 18px;
      transition: left 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 3;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.6));
    }

    /* 中间核心操作区（位于第三、四跑道之间） */
    .middle-action-area {
      margin: 8px 0 16px 0;
    }

    .btn-main {
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 20px;
      font-size: 19px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      letter-spacing: 0.5px;
      transition: transform 0.1s ease;
    }

    .btn-main:active {
      transform: scale(0.97);
    }

    .btn-start {
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      color: #fff;
      box-shadow: 0 8px 25px var(--accent-blue-glow);
    }

    .btn-run {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #fff;
      display: none;
      box-shadow: 0 8px 25px rgba(16, 185, 129, 0.25);
    }

    .btn-punch {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #000;
      display: none;
      box-shadow: 0 8px 25px var(--accent-yellow-glow);
    }

    /* 底部辅助控制区 */
    .control-area {
      display: flex;
      gap: 12px;
    }

    .btn-secondary {
      flex: 1;
      background: #181824;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 12px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      touch-action: manipulation;
    }

    .btn-secondary:active {
      background-color: #272738;
    }

    .btn-secondary:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <header>
    <div id="statusBadge" class="status-badge">准备就绪 · 等待热身</div>
    
    <div class="metrics-container">
      <div class="metric-box">
        <div class="metric-label">已跑时间</div>
        <div id="elapsedTime" class="metric-value">00:00</div>
      </div>
      <div class="metric-box" style="border-left: 1px solid var(--border-color);">
        <div class="metric-label">预计总用时</div>
        <div id="estimatedTime" class="metric-value">--:--</div>
      </div>
    </div>

    <div class="speed-info">
      平均速度: <span id="speedDisplay">0.00 km/h</span> &nbsp;|&nbsp; 配速: <span id="paceDisplay">--'--"/km</span>
    </div>
  </header>

  <!-- 中间赛道竞技场 (内含分段成绩) -->
  <div class="track-list" id="trackList"></div>

  <!-- 核心操作按钮（精确放置在中间偏下位置，方便盲按） -->
  <div class="middle-action-area">
    <button id="warmupBtn" class="btn-main btn-start" onclick="handleMainAction()">🔥 开始热身</button>
    <button id="runStartBtn" class="btn-main btn-run" onclick="handleMainAction()">🚀 开始跑步</button>
    <button id="punchBtn" class="btn-main btn-punch" onclick="handleMainAction()">🏁 到了！打卡下一个500米</button>
  </div>

  <!-- 底部辅助控制区 -->
  <div class="control-area">
    <button id="resetBtn" class="btn-secondary" onclick="resetWorkout()">清零重置</button>
    <button id="pauseBtn" class="btn-secondary" onclick="togglePause()" disabled>暂停跑步</button>
  </div>

<script>
  const TOTAL_DISTANCE = 6.0; 
  const STEP_DISTANCE = 0.5;  
  
  let currentKm = 0;          
  let startTime = null;       
  let elapsedSeconds = 0;     
  let timerInterval = null;   
  let isRunning = false;      
  let isPaused = false;       
  let wakeLock = null;        
  let workflowState = 'ready'; // 'ready' -> 'warming' -> 'running' -> 'finished'

  // 防误触保护：记录上一次点击时间
  let lastClickTime = 0;
  const COOLDOWN_TIME = 1000; // 1秒内重复点击直接忽略

  let lapTimes = { 1: null, 2: null, 3: null, 4: null, 5: null, 6: null };

  const tracks = [
    { id: 1, name: "第 1 公里", start: 0, end: 1 },
    { id: 2, name: "第 2 公里", start: 1, end: 2 },
    { id: 3, name: "第 3 公里", start: 2, end: 3 },
    { id: 4, name: "第 4 公里", start: 3, end: 4 },
    { id: 5, name: "第 5 公里", start: 4, end: 5 },
    { id: 6, name: "第 6 公里 (冲刺)", start: 5, end: 6 }
  ];

  function renderTracks() {
    const listEl = document.getElementById('trackList');
    listEl.innerHTML = '';
    
    const carTotalSeconds = isRunning || elapsedSeconds > 0 ? elapsedSeconds : 0;
    const carDistance = Math.min(carTotalSeconds * (6.0 / 2100), TOTAL_DISTANCE);

    tracks.forEach((track) => {
      const statusClass = (currentKm >= track.end || currentKm > track.start) ? 'completed' : 'pending';

      const lSec = lapTimes[track.id];
      let lapHtml = `<span class="track-lap-time empty">--'--"</span>`;
      if (lSec !== null) {
        const lMin = Math.floor(lSec / 60);
        const lS = Math.floor(lSec % 60).toString().padStart(2, '0');
        lapHtml = `<span class="track-lap-time">⏱️ ${lMin}'${lS}"</span>`;
      }

      let runnerPct = 0;
      let showRunner = false;
      
      if (currentKm >= track.end) {
        runnerPct = 100;
        showRunner = true;
      } else if (currentKm > track.start && currentKm < track.end) {
        runnerPct = ((currentKm - track.start) / (track.end - track.start)) * 100;
        showRunner = true;
      } else if (currentKm === track.start && track.start === 0 && (workflowState === 'running' || elapsedSeconds > 0)) {
        runnerPct = 0;
        showRunner = true;
      }

      let carPct = 0;
      let showCar = false;
      
      if (carDistance >= track.end) {
        carPct = 100;
        showCar = true;
      } else if (carDistance > track.start && carDistance < track.end) {
        carPct = ((carDistance - track.start) / (track.end - track.start)) * 100;
        showCar = true;
      } else if (carDistance === track.start && track.start === 0 && (workflowState === 'running' || elapsedSeconds > 0)) {
        carPct = 0;
        showCar = true;
      }

      const div = document.createElement('div');
      div.className = `track-item ${statusClass}`;
      div.innerHTML = `
        <div class="track-info-row">
          <div class="track-title-group">
            <span class="track-title">${track.name}</span>
            <span class="track-range">${track.start}k - ${track.end}k</span>
          </div>
          ${lapHtml}
        </div>
        <div class="track-bar-container">
          <div class="track-progress-fill" style="width: ${runnerPct}%"></div>
          ${showRunner ? `<div class="racer-icon" style="left: ${runnerPct}%" title="运动员(你)">🏃</div>` : ''}
          ${showCar ? `<div class="racer-icon" style="left: ${carPct}%; font-size: 18px;" title="35分钟蓝色赛车">🏎️</div>` : ''}
        </div>
      `;
      listEl.appendChild(div);
    });
  }

  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
      }
    } catch (err) {
      console.warn('Wake Lock 申请失败:', err);
    }
  }

  function releaseWakeLock() {
    if (wakeLock !== null) {
      wakeLock.release().catch(() => {});
      wakeLock = null;
    }
  }

  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible' && (workflowState === 'warming' || (isRunning && !isPaused))) {
      await requestWakeLock();
    }
  });

  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      if (!isPaused && isRunning) {
        elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
        updateTimerDisplayOnly();
        renderTracks(); 
      }
    }, 1000);
  }

  // 核心统一按钮触发器（带 1 秒误触保护）
  function handleMainAction() {
    const now = Date.now();
    if (now - lastClickTime < COOLDOWN_TIME) {
      console.log('触发防误触保护：1秒内多次点击，已忽略');
      return;
    }
    lastClickTime = now;
    if (navigator.vibrate) navigator.vibrate(60);

    if (workflowState === 'ready') {
      // 阶段 1：点击“开始热身” -> 开启防锁屏，转换成“开始跑步”
      workflowState = 'warming';
      requestWakeLock(); // 热身即不锁屏

      document.getElementById('warmupBtn').style.display = 'none';
      document.getElementById('runStartBtn').style.display = 'block';
      document.getElementById('statusBadge').innerText = "🧘 正在热身中 (屏幕常亮)";

    } else if (workflowState === 'warming') {
      // 阶段 2：点击“开始跑步” -> 正式开始计时，转换成“打卡”按钮
      workflowState = 'running';
      isRunning = true;
      isPaused = false;
      startTime = Date.now();
      elapsedSeconds = 0;

      requestWakeLock();
      startTimer();

      document.getElementById('runStartBtn').style.display = 'none';
      document.getElementById('punchBtn').style.display = 'block';
      document.getElementById('pauseBtn').disabled = false;
      document.getElementById('statusBadge').innerText = "🔥 正在跑步中 (0.0 km)";

      renderTracks();

    } else if (workflowState === 'running' && isRunning) {
      // 阶段 3：跑步中点击“打卡下一个500米”
      const prevKm = currentKm;
      if (currentKm < TOTAL_DISTANCE) {
        currentKm = Math.min(currentKm + STEP_DISTANCE, TOTAL_DISTANCE);
      }

      const currentIntKm = Math.floor(currentKm);
      const prevIntKm = Math.floor(prevKm);
      
      if (currentIntKm > prevIntKm && currentIntKm <= 6) {
        if (!window.cumulativeLapSeconds) window.cumulativeLapSeconds = {};
        window.cumulativeLapSeconds[currentIntKm] = elapsedSeconds;

        const prevSecs = currentIntKm === 1 ? 0 : (window.cumulativeLapSeconds[currentIntKm - 1] || 0);
        lapTimes[currentIntKm] = elapsedSeconds - prevSecs;
      }

      triggerCalculation();

      if (currentKm >= TOTAL_DISTANCE) {
        workflowState = 'finished';
        isRunning = false;
        releaseWakeLock();
        clearInterval(timerInterval);
        document.getElementById('statusBadge').innerText = "🎉 挑战圆满完成！";
        document.getElementById('punchBtn').innerText = "已完成全部 6 公里";
        document.getElementById('punchBtn').disabled = true;
        document.getElementById('pauseBtn').disabled = true;
      }
    }
  }

  function updateTimerDisplayOnly() {
    const mins = Math.floor(elapsedSeconds / 60).toString().padStart(2, '0');
    const secs = (elapsedSeconds % 60).toString().padStart(2, '0');
    document.getElementById('elapsedTime').innerText = `${mins}:${secs}`;
  }

  function triggerCalculation() {
    updateTimerDisplayOnly();

    if (currentKm > 0 && elapsedSeconds > 0) {
      const speed = currentKm / (elapsedSeconds / 3600);
      document.getElementById('speedDisplay').innerText = `${speed.toFixed(2)} km/h`;

      const paceTotalSec = elapsedSeconds / currentKm;
      const paceMin = Math.floor(paceTotalSec / 60);
      const paceSec = Math.floor(paceTotalSec % 60).toString().padStart(2, '0');
      document.getElementById('paceDisplay').innerText = `${paceMin}'${paceSec}"/km`;

      const remainingKm = TOTAL_DISTANCE - currentKm;
      const remainingSeconds = speed > 0 ? (remainingKm / speed) * 3600 : 0;
      const estTotalSec = elapsedSeconds + remainingSeconds;

      const estMin = Math.floor(estTotalSec / 60).toString().padStart(2, '0');
      const estSec = Math.floor(estTotalSec % 60).toString().padStart(2, '0');
      document.getElementById('estimatedTime').innerText = `${estMin}:${estSec}`;

      document.getElementById('statusBadge').innerText = `⚡ 已打卡 (${currentKm.toFixed(1)} / 6.0 km)`;
    }
    renderTracks();
  }

  function togglePause() {
    if (!isRunning && elapsedSeconds === 0) return;

    isPaused = !isPaused;
    const pauseBtn = document.getElementById('pauseBtn');
    
    if (isPaused) {
      isRunning = false;
      releaseWakeLock();
      pauseBtn.innerText = "继续跑步";
      document.getElementById('statusBadge').innerText = `⏸️ 已暂停 (${currentKm.toFixed(1)} km)`;
    } else {
      isRunning = true;
      startTime = Date.now() - (elapsedSeconds * 1000);
      requestWakeLock();
      pauseBtn.innerText = "暂停跑步";
      triggerCalculation();
    }
    renderTracks();
  }

  function resetWorkout() {
    isRunning = false;
    isPaused = false;
    currentKm = 0;
    elapsedSeconds = 0;
    startTime = null;
    workflowState = 'ready';
    lastClickTime = 0;
    window.cumulativeLapSeconds = {};
    lapTimes = { 1: null, 2: null, 3: null, 4: null, 5: null, 6: null };
    if (timerInterval) clearInterval(timerInterval);
    releaseWakeLock();

    document.getElementById('statusBadge').innerText = "准备就绪 · 等待热身";
    document.getElementById('elapsedTime').innerText = "00:00";
    document.getElementById('estimatedTime').innerText = "--:--";
    document.getElementById('speedDisplay').innerText = "0.00 km/h";
    document.getElementById('paceDisplay').innerText = "--'--\"/km";
    
    document.getElementById('warmupBtn').style.display = 'block';
    document.getElementById('runStartBtn').style.display = 'none';
    document.getElementById('punchBtn').style.display = 'none';
    document.getElementById('punchBtn').innerText = "🏁 到了！打卡下一个500米";
    document.getElementById('punchBtn').disabled = false;
    document.getElementById('pauseBtn').innerText = "暂停跑步";
    document.getElementById('pauseBtn').disabled = true;
    
    renderTracks();
  }

  renderTracks();
</script>
</body>
</html>
