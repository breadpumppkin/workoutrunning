<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>挑战永不停歇</title>
  <style>
    :root {
      --bg-color: #0b0b0f;
      --card-bg: #16161f;
      --accent-green: #10b981;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 16px env(safe-area-inset-bottom, 20px) 16px;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      padding-top: 10px;
    }

    .status-badge {
      display: inline-block;
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-green);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 20px;
    }

    .metrics-container {
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 100%;
      margin-bottom: 10px;
    }

    .metric-box {
      text-align: center;
    }

    .metric-label {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .metric-value {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .speed-info {
      text-align: center;
      font-size: 15px;
      color: var(--text-muted);
      margin-bottom: 25px;
    }

    .speed-info span {
      color: var(--accent-green);
      font-weight: 600;
    }

    /* 赛道进度展示区 */
    .track-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .track-item {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.3s ease;
    }

    .track-item.active {
      border-color: var(--accent-green);
      background: rgba(16, 185, 129, 0.05);
    }

    .track-item.completed {
      opacity: 0.6;
    }

    .track-title {
      font-size: 14px;
      font-weight: 500;
    }

    .track-range {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* 底部按钮控制区 */
    .control-area {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-primary {
      width: 100%;
      background-color: var(--accent-green);
      color: #000;
      border: none;
      border-radius: 16px;
      padding: 18px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.1s ease, background-color 0.2s;
    }

    .btn-primary:active {
      transform: scale(0.98);
      background-color: #059669;
    }

    .btn-group {
      display: flex;
      gap: 12px;
    }

    .btn-secondary {
      flex: 1;
      background-color: #27272a;
      color: var(--text-main);
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      touch-action: manipulation;
    }

    .btn-secondary:active {
      background-color: #3f3f46;
    }
  </style>
</head>
<body>

  <header>
    <div id="statusBadge" class="status-badge">准备就绪 (0.0 km)</div>
    
    <div class="metrics-container">
      <div class="metric-box">
        <div class="metric-label">已跑时间</div>
        <div id="elapsedTime" class="metric-value">00:00</div>
      </div>
      <div class="metric-box">
        <div class="metric-label">预计总用时</div>
        <div id="estimatedTime" class="metric-value">--:--</div>
      </div>
    </div>

    <div class="speed-info">
      目前平均速度: <span id="speedDisplay">0.00 km/h</span> (<span id="paceDisplay">--'--"/km</span>)
    </div>
  </header>

  <!-- 6公里分段列表 -->
  <div class="track-list" id="trackList">
    <!-- 动态生成 -->
  </div>

  <div class="control-area">
    <button id="actionBtn" class="btn-primary" onclick="handlePunch()">到了！打卡下一个500米</button>
    <div class="btn-group">
      <button class="btn-secondary" onclick="resetWorkout()">清零</button>
      <button id="pauseBtn" class="btn-secondary" onclick="togglePause()">暂停跑步</button>
    </div>
  </div>

<script>
  const TOTAL_DISTANCE = 6.0; // 总距离 6 公里
  const STEP_DISTANCE = 0.5;  // 每次打卡 500米 (0.5 km)
  
  let currentKm = 0;          // 当前已跑距离
  let startTime = null;       // 开始时间戳
  let elapsedSeconds = 0;     // 已用总秒数
  let timerInterval = null;   // 计时器句柄
  let isRunning = false;      // 运行状态
  let isPaused = false;       // 暂停状态
  let wakeLock = null;        // 屏幕防锁屏句柄

  const tracks = [
    { name: "第 1 公里", range: "0k - 1k" },
    { name: "第 2 公里", range: "1k - 2k" },
    { name: "第 3 公里", range: "2k - 3k" },
    { name: "第 4 公里", range: "3k - 4k" },
    { name: "第 5 公里", range: "4k - 5k" },
    { name: "第 6 公里 (冲刺)", range: "5k - 6k" }
  ];

  // 初始化渲染赛道列表
  function renderTracks() {
    const listEl = document.getElementById('trackList');
    listEl.innerHTML = '';
    
    // 计算当前处于第几公里区间 (0~1km 算第1公里，以此类推)
    const currentKmIndex = Math.min(Math.floor(currentKm), 5);
    
    tracks.forEach((track, index) => {
      let statusClass = '';
      if (index < currentKmIndex || (currentKm >= 6)) {
        statusClass = 'completed';
      } else if (index === currentKmIndex && isRunning) {
        statusClass = 'active';
      }

      const div = document.createElement('div');
      div.className = `track-item ${statusClass}`;
      div.innerHTML = `
        <span class="track-title">${track.name}</span>
        <span class="track-range">${track.range}</span>
      `;
      listEl.appendChild(div);
    });
  }

  // 核心：请求保持屏幕常亮 (iPhone Safari 支持)
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
      }
    } catch (err) {
      console.warn('Wake Lock 申请失败:', err);
    }
  }

  // 释放常亮
  function releaseWakeLock() {
    if (wakeLock !== null) {
      wakeLock.release().catch(() => {});
      wakeLock = null;
    }
  }

  // 监听页面可见性：用户切回 Safari 时自动重新锁屏常亮
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible' && isRunning && !isPaused) {
      await requestWakeLock();
    }
  });

  // 主计时器循环
  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    
    timerInterval = setInterval(() => {
      if (!isPaused && isRunning) {
        elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
        updateDisplay();
      }
    }, 1000);
  }

  // 点击打卡 / 开始
  function handlePunch() {
    // 触觉反馈 (兼容支持的设备)
    if (navigator.vibrate) navigator.vibrate(50);

    if (!isRunning) {
      // 第一次点击，正式开始
      isRunning = true;
      isPaused = false;
      startTime = Date.now() - (elapsedSeconds * 1000);
      requestWakeLock();
      startTimer();
    }

    if (currentKm < TOTAL_DISTANCE) {
      currentKm = Math.min(currentKm + STEP_DISTANCE, TOTAL_DISTANCE);
    }

    updateDisplay();

    if (currentKm >= TOTAL_DISTANCE) {
      // 跑完 6 公里
      isRunning = false;
      releaseWakeLock();
      clearInterval(timerInterval);
      document.getElementById('statusBadge').innerText = "🎉 挑战完成！";
      document.getElementById('actionBtn').innerText = "已完成全部 6 公里";
      document.getElementById('actionBtn').disabled = true;
    }
  }

  // 暂停 / 继续
  function togglePause() {
    if (!isRunning && elapsedSeconds === 0) return;

    isPaused = !isPaused;
    const pauseBtn = document.getElementById('pauseBtn');
    
    if (isPaused) {
      isRunning = false;
      releaseWakeLock;
      pauseBtn.innerText = "继续跑步";
      document.getElementById('statusBadge').innerText = `已暂停 (${currentKm.toFixed(1)} km)`;
    } else {
      isRunning = true;
      startTime = Date.now() - (elapsedSeconds * 1000);
      requestWakeLock();
      pauseBtn.innerText = "暂停跑步";
      document.getElementById('statusBadge').innerText = `打卡成功 (${currentKm.toFixed(1)} km)`;
    }
    renderTracks();
  }

  // 清零重置
  function resetWorkout() {
    isRunning = false;
    isPaused = false;
    currentKm = 0;
    elapsedSeconds = 0;
    startTime = null;
    if (timerInterval) clearInterval(timerInterval);
    releaseWakeLock();

    document.getElementById('statusBadge').innerText = "准备就绪 (0.0 km)";
    document.getElementById('elapsedTime').innerText = "00:00";
    document.getElementById('estimatedTime').innerText = "--:--";
    document.getElementById('speedDisplay').innerText = "0.00 km/h";
    document.getElementById('paceDisplay').innerText = "--'--\"/km";
    document.getElementById('actionBtn').innerText = "到了！打卡下一个500米";
    document.getElementById('actionBtn').disabled = false;
    document.getElementById('pauseBtn').innerText = "暂停跑步";
    
    renderTracks();
  }

  // 刷新所有计算与显示
  function updateDisplay() {
    // 1. 格式化已跑时间 (MM:SS)
    const mins = Math.floor(elapsedSeconds / 60).toString().padStart(2, '0');
    const secs = (elapsedSeconds % 60).toString().padStart(2, '0');
    document.getElementById('elapsedTime').innerText = `${mins}:${secs}`;

    if (currentKm > 0 && elapsedSeconds > 0) {
      // 2. 速度计算 (km/h) = 距离 / (秒 / 3600)
      const speed = (currentKm / (elapsedSeconds / 3600)).toFixed(2);
      document.getElementById('speedDisplay').innerText = `${speed} km/h`;

      // 3. 配速计算 (秒/公里)
      const paceTotalSec = elapsedSeconds / currentKm;
      const paceMin = Math.floor(paceTotalSec / 60);
      const paceSec = Math.floor(paceTotalSec % 60).toString().padStart(2, '0');
      document.getElementById('paceDisplay').innerText = `${paceMin}'${paceSec}"/km`;

      // 4. 预计总用时 (按当前平均速度跑完 6km)
      const estTotalSec = paceTotalSec * TOTAL_DISTANCE;
      const estMin = Math.floor(estTotalSec / 60).toString().padStart(2, '0');
      const estSec = Math.floor(estTotalSec % 60).toString().padStart(2, '0');
      document.getElementById('estimatedTime').innerText = `${estMin}:${estSec}`;
    }

    if (currentKm > 0 && currentKm < TOTAL_DISTANCE && isRunning) {
      document.getElementById('statusBadge').innerText = `打卡成功 (${currentKm.toFixed(1)} km)`;
    }

    renderTracks();
  }

  // 初始化首次渲染
  renderTracks();
</script>
</body>
</html>
