<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>跑表 | 汗水与配速</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            margin: 0;
            background-color: #000000;
            color: #ffffff;
            padding: 20px;
            box-sizing: border-box;
            user-select: none;
        }
        #status-bar { font-size: 13px; padding: 5px 14px; border-radius: 20px; background: #1c1c1e; color: #a2a2a2; }
        
        /* 核心数据面板 */
        .time-panel {
            width: 100%;
            display: flex;
            justify-content: space-around;
            text-align: center;
            margin-top: 5px;
        }
        .time-box { flex: 1; }
        .label { font-size: 13px; color: #8e8e93; letter-spacing: 1px; margin-bottom: 2px; }
        .time-num { font-size: 46px; font-weight: bold; font-variant-numeric: tabular-nums; }
        
        #prediction-box { font-size: 16px; color: #ffffff; min-height: 44px; margin: 5px 0; line-height: 1.4; text-align: center; }
        .predict-highlight { color: #34c759; font-weight: bold; }
        
        /* 🏁 巨型蜿蜒环形跑道区域 */
        .arena {
            width: 100%;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin: 10px 0;
        }
        svg {
            width: 90%;
            height: auto;
            max-height: 35vh;
        }
        .track-bg {
            fill: none;
            stroke: #2c2c2e;
            stroke-width: 14;
            stroke-linecap: round;
        }
        .avatar {
            position: absolute;
            font-size: 32px; 
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
        }
        #pacer { color: #ff9500; } 
        #user-runner { z-index: 11; } 

        .controls { width: 100%; display: flex; flex-direction: column; gap: 12px; }
        .btn { width: 100%; border: none; border-radius: 16px; font-weight: bold; color: white; cursor: pointer; text-align: center; }
        .btn-hit { padding: 24px 0; font-size: 24px; background-color: #34c759; box-shadow: 0 4px 15px rgba(52,199,89,0.3); }
        .btn-hit:active { transform: scale(0.98); }
        .btn-group { display: flex; gap: 15px; }
        .btn-side { padding: 14px 0; font-size: 16px; background-color: #1c1c1e; }
        #startBtn { color: #34c759; border: 1px solid #34c759; }
        #resetBtn { color: #8e8e93; }
    </style>
</head>
<body>

    <div id="status-bar">⏳ 待机中</div>

    <div class="time-panel">
        <div class="time-box">
            <div class="label">已跑时间</div>
            <div id="total-time" class="time-num">00:00</div>
        </div>
        <div class="time-box">
            <div class="label">目标剩余</div>
            <div id="remaining-time" class="time-num">35:00</div>
        </div>
    </div>

    <div id="prediction-box">请点击下方“开始跑步”按钮</div>

    <!-- 🏁 巨型蜿蜒赛车场 -->
    <div class="arena" id="race-arena">
        <svg id="track-svg" viewBox="0 0 300 200">
            <path id="race-path" class="track-bg" d="M 30,30 C 150,30 150,90 30,90 C -50,90 70,170 150,170 C 270,170 270,30 150,30 Z" />
        </svg>
        <div id="pacer" class="avatar">🏎️</div>
        <!-- 🌟 已为您完美切回最初的经典跑步人图标 -->
        <div id="user-runner" class="avatar">🏃‍♂️</div>
    </div>

    <div class="controls">
        <button class="btn btn-hit" id="lapBtn" onclick="handleLapClick()" style="display:none;">🏃‍♂️ 到了！打卡下一个500米</button>
        <div class="btn-group">
            <button class="btn btn-side" id="resetBtn" onclick="handleResetClick()">清零</button>
            <button class="btn btn-side" id="startBtn" onclick="handleStartClick()">开始跑步</button>
        </div>
    </div>

    <script>
        let startTime = 0, elapsedTime = 0, timerInterval = null, isRunning = false, wakeLock = null;
        let lapCount = 0, lastLapTime = 0;
        const TARGET_SECONDS = 35 * 60; 

        const timeEl = document.getElementById('total-time');
        const remainingEl = document.getElementById('remaining-time');
        const startBtn = document.getElementById('startBtn');
        const lapBtn = document.getElementById('lapBtn');
        const predictionBox = document.getElementById('prediction-box');
        const statusBar = document.getElementById('status-bar');
        
        const pathEl = document.getElementById('race-path');
        const pacerEl = document.getElementById('pacer');
        const userEl = document.getElementById('user-runner');
        const arenaEl = document.getElementById('race-arena');

        let pathLength = 0;
        window.addEventListener('load', () => {
            pathLength = pathEl.getTotalLength();
            updateAvatarsLayout(); 
        });

        // 核心定位函数：根据进度百分比，自动算出小人在S形曲线上的像素坐标
        function moveAvatarOnPath(element, percent) {
            if (!pathLength) pathLength = pathEl.getTotalLength();
            let distance = (percent / 100) * pathLength;
            let point = pathEl.getPointAtLength(distance);
            
            let svgBox = pathEl.getBoundingClientRect();
            let arenaBox = arenaEl.getBoundingClientRect();
            
            let x = svgBox.left - arenaBox.left + (point.x * (svgBox.width / 300));
            let y = svgBox.top - arenaBox.top + (point.y * (svgBox.height / 200));
            
            element.style.left = x + 'px';
            element.style.top = y + 'px';
        }

        function updateAvatarsLayout() {
            let seconds = elapsedTime / 1000;
            let pacerPct = Math.min((seconds / TARGET_SECONDS) * 100, 100);
            let userPct = (lapCount / 12) * 100;
            
            moveAvatarOnPath(pacerEl, pacerPct);
            moveAvatarOnPath(userEl, userPct);
        }

        function handleStartClick() {
            if (!isRunning) {
                if ('wakeLock' in navigator) {
                    navigator.wakeLock.request('screen').then(lock => { wakeLock = lock; statusBar.innerText = "🟢 屏幕常亮已激活"; }).catch(() => { statusBar.innerText = "⏳ 计时中"; });
                } else { statusBar.innerText = "⏳ 计时中"; }

                startTime = Date.now() - elapsedTime;
                timerInterval = setInterval(() => {
                    elapsedTime = Date.now() - startTime;
                    
                    let m = Math.floor(elapsedTime / 60000).toString().padStart(2, '0');
                    let s = Math.floor((elapsedTime % 60000) / 1000).toString().padStart(2, '0');
                    timeEl.innerText = m + ":" + s;
                    
                    let remSec = Math.max(TARGET_SECONDS - Math.floor(elapsedTime / 1000), 0);
                    let remM = Math.floor(remSec / 60).toString().padStart(2, '0');
                    let remS = (remSec % 60).toString().padStart(2, '0');
                    remainingEl.innerText = remM + ":" + remS;
                    
                    let seconds = elapsedTime / 1000;
                    let pacerPct = Math.min((seconds / TARGET_SECONDS) * 100, 100);
                    moveAvatarOnPath(pacerEl, pacerPct);
                }, 200);

                isRunning = true;
                startBtn.innerText = "暂停";
                lapBtn.style.display = "block";
                if(lapCount === 0) predictionBox.innerHTML = "比赛开始！每到跑步机500米，点击大绿键打卡";
            } else {
                clearInterval(timerInterval);
                isRunning = false;
                startBtn.innerText = "恢复";
                statusBar.innerText = "⏸️ 已暂停";
            }
        }

        function handleLapClick() {
            if (!isRunning) return;
            lapCount++;
            if (lapCount > 12) lapCount = 12;

            lastLapTime = elapsedTime;
            let km = (lapCount * 0.5).toFixed(1);

            let userPct = (lapCount / 12) * 100;
            moveAvatarOnPath(userEl, userPct);

            if (lapCount >= 12) {
                predictionBox.innerHTML = `🏁 6 公里已全部跑完！终点打卡成功！`;
            } else {
                let finalTotalMs = (elapsedTime / lapCount) * 12;
                let resMin = Math.floor(finalTotalMs / 60000);
                let resSec = Math.floor((finalTotalMs % 60000) / 1000).toString().padStart(2, '0');
                predictionBox.innerHTML = `已过第 ` + lapCount + ` 个点 (` + km + `k)<br>按当前整体均速，预测 6k 完赛总用时：<br><span class="predict-highlight">` + resMin + ` 分 ` + resSec + ` 秒</span>`;
            }
            try { window.navigator.vibrate(40); } catch(e) {}
        }

        function handleResetClick() {
            clearInterval(timerInterval);
            isRunning = false;
            elapsedTime = 0; lapCount = 0; lastLapTime = 0;
            timeEl.innerText = "00:00";
            remainingEl.innerText = "35:00";
            predictionBox.innerHTML = "请点击下方“开始跑步”按钮";
            startBtn.innerText = "开始跑步";
            lapBtn.style.display = "none";
            statusBar.innerText = "⏳ 待机中";
            updateAvatarsLayout();
            if (wakeLock) { wakeLock.release(); wakeLock = null; }
        }

        window.addEventListener('resize', updateAvatarsLayout);
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && isRunning) {
                updateAvatarsLayout();
            }
        });
    </script>
</body>
</html>
