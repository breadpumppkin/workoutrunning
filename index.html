<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>跑表雷达检测版 | 6公里直道竞技场</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            margin: 0;
            background-color: #000000;
            color: #ffffff;
            padding: 15px 20px;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        #status-bar {
            font-size: 13px;
            padding: 4px 14px;
            border-radius: 20px;
            background: #1c1c1e;
            color: #a2a2a2;
        }
        .time-panel {
            width: 100%;
            display: flex;
            justify-content: space-around;
            text-align: center;
        }
        .time-box {
            flex: 1;
        }
        .label {
            font-size: 13px;
            color: #8e8e93;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }
        .time-num {
            font-size: 42px;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
        }
        #prediction-box {
            font-size: 14px;
            color: #ff9500; /* 临时改成橙色方便看报错 */
            min-height: 50px;
            margin: 5px 0;
            line-height: 1.4;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            background: #1c1c1e;
            border-radius: 8px;
            padding: 5px;
        }
        .predict-highlight { color: #34c759; font-weight: bold; }
        .predict-warn { color: #ff3b30; font-weight: bold; }
        
        .arena {
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            padding: 10px 0;
        }
        .track-row {
            width: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .track-name {
            font-size: 11px;
            color: #8e8e93;
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
        }
        .track-rail {
            position: relative;
            width: 100%;
            height: 4px;
            background: #2c2c2e;
            border-radius: 2px;
        }
        .mid-mark {
            position: absolute;
            left: 50%;
            top: -3px;
            width: 2px;
            height: 10px;
            background: #444;
        }
        .avatar {
            position: absolute;
            top: -22px;
            font-size: 20px;
            transform: translateX(-50%);
            z-index: 10;
        }
        .user-av {
            color: #34c759;
            font-weight: bold;
            transition: left 0.25s ease;
        }
        
        .controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            width: 100%;
            border: none;
            border-radius: 16px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            text-align: center;
            outline: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: rgba(0,0,0,0);
        }
        .btn-hit {
            padding: 20px 0;
            font-size: 20px;
            background-color: #34c759;
        }
        .btn-group {
            display: flex;
            gap: 15px;
        }
        .btn-side {
            padding: 14px 0;
            font-size: 16px;
            background-color: #1c1c1e;
        }
        #finalStartBtn {
            color: #34c759;
            border: 1px solid #34c759;
        }
        #finalResetBtn {
            color: #8e8e93;
        }
    </style>
</head>
<body>
    <div id="status-bar">⏳ 待机中</div>
    
    <div class="time-panel">
        <div class="time-box">
            <div class="label">已跑时间</div>
            <div id="total-time" class="time-num">00:00</div>
        </div>
        <div class="time-box">
            <div class="label">目标剩余</div>
            <div id="remaining-time" class="time-num">35:00</div>
        </div>
    </div>
    
    <!-- 🌟 这个框会实时打印手机里的异常报错 🌟 -->
    <div id="prediction-box">雷达就绪：请点击下方“开始跑步”检测报错</div>
    
    <div class="arena">
        <div class="track-row">
            <div class="track-name"><span>第 1 公里</span><span>0k - 1k</span></div>
            <div class="track-rail"><div class="mid-mark"></div><div id="pacer-0" class="avatar" style="left:0%; display:block;">🏎️</div><div id="user-0" class="avatar user-av" style="left:0%; display:block;">🏃‍♂️</div></div>
        </div>
        <div class="track-row">
            <div class="track-name"><span>第 2 公里</span><span>1k - 2k</span></div>
            <div class="track-rail"><div class="mid-mark"></div><div id="pacer-1" class="avatar" style="left:0%; display:none;">🏎️</div><div id="user-1" class="avatar user-av" style="left:0%; display:none;">🏃‍♂️</div></div>
        </div>
        <div class="track-row">
            <div class="track-name"><span>第 3 公里</span><span>2k - 3k</span></div>
            <div class="track-rail"><div class="mid-mark"></div><div id="pacer-2" class="avatar" style="left:0%; display:none;">🏎️</div><div id="user-2" class="avatar user-av" style="left:0%; display:none;">🏃‍♂️</div></div>
        </div>
        <div class="track-row">
            <div class="track-name"><span>第 4 公里</span><span>3k - 4k</span></div>
            <div class="track-rail"><div class="mid-mark"></div><div id="pacer-3" class="avatar" style="left:0%; display:none;">🏎️</div><div id="user-3" class="avatar user-av" style="left:0%; display:none;">🏃‍♂️</div></div>
        </div>
        <div class="track-row">
            <div class="track-name"><span>第 5 公里</span><span>4k - 5k</span></div>
            <div class="track-rail"><div class="mid-mark"></div><div id="pacer-4" class="avatar" style="left:0%; display:none;">🏎️</div><div id="user-4" class="avatar user-av" style="left:0%; display:none;">🏃‍♂️</div></div>
        </div>
        <div class="track-row">
            <div class="track-name"><span>第 6 公里 (冲刺)</span><span>5k - 6k</span></div>
            <div class="track-rail"><div class="mid-mark"></div><div id="pacer-5" class="avatar" style="left:0%; display:none;">🏎️</div><div id="user-5" class="avatar user-av" style="left:0%; display:none;">🏃‍♂️</div></div>
        </div>
    </div>
    
    <div class="controls">
        <button class="btn btn-hit" id="finalLapBtn" style="display:none;">🏃‍♂️ 到了！打卡下一个500米</button>
        <div class="btn-group">
            <button class="btn btn-side" id="finalResetBtn">清零</button>
            <button class="btn btn-side" id="finalStartBtn">开始跑步</button>
        </div>
    </div>

    <script>
        var domPredictionBox = document.getElementById('prediction-box');

        // 🚨 雷达1号：捕获页面初装及运行时的任何致命阻塞报错
        window.onerror = function(message, source, lineno, colno, error) {
            var errText = "【运行报错】" + message + " (行:" + lineno + ")";
            domPredictionBox.innerText = errText;
            alert(errText); // 弹窗强力拦截提示
            return false;
        };

        var runStartTime = 0;
        var runElapsedTime = 0;
        var runTimerInterval = null;
        var runIsRunning = false;
        var runLapCount = 0;
        
        var TARGET_SECONDS = 35 * 60; 
        var TIME_PER_KM = TARGET_SECONDS / 6; 
        
        var domTotalTime = document.getElementById('total-time');
        var domRemainingTime = document.getElementById('remaining-time');
        var domStartBtn = document.getElementById('finalStartBtn');
        var domLapBtn = document.getElementById('finalLapBtn');
        var domStatusBar = document.getElementById('status-bar');
        var domResetBtn = document.getElementById('finalResetBtn');

        function clearAllAvatars() {
            for(var i = 0; i < 6; i++) {
                document.getElementById('pacer-' + i).style.display = 'none';
                document.getElementById('user-' + i).style.display = 'none';
            }
        }

        function updateAvatarPositions() {
            clearAllAvatars();
            var currentSec = runElapsedTime / 1000;

            var pacerIdx = Math.floor(currentSec / TIME_PER_KM);
            if (pacerIdx < 0) pacerIdx = 0;
            if (pacerIdx > 5) pacerIdx = 5;
            var pacerTrackSec = currentSec - (pacerIdx * TIME_PER_KM);
            var pacerPercent = (pacerTrackSec / TIME_PER_KM) * 100;
            
            if (currentSec >= TARGET_SECONDS) {
                pacerIdx = 5;
                pacerPercent = 100;
            }
            
            var nodePacer = document.getElementById('pacer-' + pacerIdx);
            if(nodePacer) {
                nodePacer.style.left = pacerPercent + '%';
                nodePacer.style.display = 'block';
            }

            var userIdx = 0;
            var userPercent = 0;
            if (runLapCount > 0) {
                userIdx = Math.floor((runLapCount - 1) / 2);
                if (userIdx > 5) userIdx = 5;
                userPercent = (runLapCount % 2 === 1) ? 50 : 100;
                
                if(runLapCount >= 12) {
                    userIdx = 5;
                    userPercent = 100;
                }
            }

            var nodeUser = document.getElementById('user-' + userIdx);
            if(nodeUser) {
                nodeUser.style.left = userPercent + '%';
