<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>跑表 | 6公里直道竞技场</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            margin: 0;
            background-color: #000000;
            color: #ffffff;
            padding: 15px 20px;
            box-sizing: border-box;
        }
        #status-bar {
            font-size: 13px;
            padding: 4px 14px;
            border-radius: 20px;
            background: #1c1c1e;
            color: #a2a2a2;
        }
        .time-panel {
            width: 100%;
            display: flex;
            justify-content: space-around;
            text-align: center;
        }
        .time-box {
            flex: 1;
        }
        .label {
            font-size: 13px;
            color: #8e8e93;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }
        .time-num {
            font-size: 42px;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
        }
        #prediction-box {
            font-size: 15px;
            color: #ffffff;
            min-height: 44px;
            margin: 5px 0;
            line-height: 1.4;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .predict-highlight { color: #34c759; font-weight: bold; }
        .predict-warn { color: #ff3b30; font-weight: bold; }
        
        /* 🏁 6公里6条跑道 */
        .arena {
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            padding: 10px 0;
        }
        .track-row {
            width: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .track-name {
            font-size: 11px;
            color: #8e8e93;
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
        }
        .track-rail {
            position: relative;
            width: 100%;
            height: 4px;
            background: #2c2c2e;
            border-radius: 2px;
        }
        .mid-mark {
            position: absolute;
            left: 50%;
            top: -3px;
            width: 2px;
            height: 10px;
            background: #444;
        }
        .avatar {
            position: absolute;
            top: -22px;
            font-size: 20px;
            transform: translateX(-50%);
            z-index: 10;
        }
        .user-av {
            color: #34c759;
            font-weight: bold;
            transition: left 0.25s ease;
        }
        
        /* 底部控制按钮优化 */
        .controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            width: 100%;
            border: none;
            border-radius: 16px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            text-align: center;
            outline: none;
            /* 解决移动端点击高亮延迟 */
            -webkit-tap-highlight-color: rgba(0,0,0,0);
        }
        .btn-hit {
            padding: 20px 0;
            font-size: 20px;
            background-color: #34c759;
            box-shadow: 0 4px 15px rgba(52,199,89,0.3);
        }
        .btn-hit:active {
            transform: scale(0.98);
            background-color: #2da94f;
        }
        .btn-group {
            display: flex;
            gap: 15px;
        }
        .btn-side {
            padding: 14px 0;
            font-size: 16px;
            background-color: #1c1c1e;
        }
        .btn-side:active {
            background-color: #2c2c2e;
        }
        #btn-action-start {
            color: #34c759;
            border: 1px solid #34c759;
        }
        #btn-action-reset {
            color: #8e8e93;
        }
    </style>
</head>
<body>
    <div id="status-bar">⏳ 待机中</div>
    
    <div class="time-panel">
        <div class="time-box">
            <div class="label">已跑时间</div>
            <div id="total-time" class="time-num">00:00</div>
        </div>
        <div class="time-box">
            <div class="label">目标剩余</div>
            <div id="remaining-time" class="time-num">35:00</div>
        </div>
    </div>
    
    <div id="prediction-box">请点击下方“开始跑步”按钮</div>
    
    <div class="arena">
        <div class="track-row">
            <div class="track-name"><span>第 1 公里</span><span>0k - 1k</span></div>
            <div class="track-rail"><div class="mid-mark"></div><div id="pacer-0" class="avatar" style="left:0%; display:block;">🏎️</div><div id="user-0" class="avatar user-av" style="left:0%; display:block;">🏃‍♂️</div></div>
        </div>
        <div class="track-row">
            <div class="track-name"><span>第 2 公里</span><span>1k - 2k</span></div>
            <div class="track-rail"><div class="mid-mark"></div><div id="pacer-1" class="avatar" style="left:0%; display:none;">🏎️</div><div id="user-1" class="avatar user-av" style="left:0%; display:none;">🏃‍♂️</div></div>
        </div>
        <div class="track-row">
            <div class="track-name"><span>第 3 公里</span><span>2k - 3k</span></div>
            <div class="track-rail"><div class="mid-mark"></div><div id="pacer-2" class="avatar" style="left:0%; display:none;">🏎️</div><div id="user-2" class="avatar user-av" style="left:0%; display:none;">🏃‍♂️</div></div>
        </div>
        <div class="track-row">
            <div class="track-name"><span>第 4 公里</span><span>3k - 4k</span></div>
            <div class="track-rail"><div class="mid-mark"></div><div id="pacer-3" class="avatar" style="left:0%; display:none;">🏎️</div><div id="user-3" class="avatar user-av" style="left:0%; display:none;">🏃‍♂️</div></div>
        </div>
        <div class="track-row">
            <div class="track-name"><span>第 5 公里</span><span>4k - 5k</span></div>
            <div class="track-rail"><div class="mid-mark"></div><div id="pacer-4" class="avatar" style="left:0%; display:none;">🏎️</div><div id="user-4" class="avatar user-av" style="left:0%; display:none;">🏃‍♂️</div></div>
        </div>
        <div class="track-row">
            <div class="track-name"><span>第 6 公里 (冲刺)</span><span>5k - 6k</span></div>
            <div class="track-rail"><div class="mid-mark"></div><div id="pacer-5" class="avatar" style="left:0%; display:none;">🏎️</div><div id="user-5" class="avatar user-av" style="left:0%; display:none;">🏃‍♂️</div></div>
        </div>
    </div>
    
    <div class="controls">
        <!-- 核心重构：彻底更改ID命名规则，从根源杜绝浏览器全局对象污染 -->
        <button class="btn btn-hit" id="btn-action-lap" style="display:none;">🏃‍♂️ 到了！打卡下一个500米</button>
        <div class="btn-group">
            <button class="btn btn-side" id="btn-action-reset">清零</button>
            <button class="btn btn-side" id="btn-action-start">开始跑步</button>
        </div>
    </div>

    <script>
        // 将所有逻辑放入 window.onload 沙箱中，确保DOM树完全就绪后由安全的局部作用域接管
        window.onload = function() {
            let startTime = 0, elapsedTime = 0, timerInterval = null, isRunning = false;
            let lapCount = 0;
            const TARGET_SECONDS = 35 * 60; 
            const TIME_PER_KM = TARGET_SECONDS / 6; 
            
            let domTime = document.getElementById('total-time');
            let domRemaining = document.getElementById('remaining-time');
            let domStartBtn = document.getElementById('btn-action-start');
            let domLapBtn = document.getElementById('btn-action-lap');
            let domPredictionBox = document.getElementById('prediction-box');
            let domStatusBar = document.getElementById('status-bar');
            let domResetBtn = document.getElementById('btn-action-reset');

            function hideAllAvatars() {
                for(let i=0; i<6; i++) {
                    document.getElementById('pacer-' + i).style.display = 'none';
                    document.getElementById('user-' + i).style.display = 'none';
                }
            }

            function renderAvatars() {
                hideAllAvatars();
                let elapsedSec = elapsedTime / 1000;

                let pacerTrackIdx = Math.floor(elapsedSec / TIME_PER_KM);
                if (pacerTrackIdx < 0) pacerTrackIdx = 0;
                if (pacerTrackIdx > 5) pacerTrackIdx = 5;
                let pacerTrackSec = elapsedSec - (pacerTrackIdx * TIME_PER_KM);
                let pacerPct = (pacerTrackSec / TIME_PER_KM) * 100;
                
                if (elapsedSec >= TARGET_SECONDS) {
                    pacerTrackIdx = 5;
                    pacerPct = 100;
                }
                
                let pacerNode = document.getElementById('pacer-' + pacerTrackIdx);
                if(pacerNode) {
                    pacerNode.style.left = pacerPct + '%';
                    pacerNode.style.display = 'block';
                }

                let userTrackIdx = 0;
                let userPct = 0;
                if (lapCount > 0) {
                    userTrackIdx = Math.floor((lapCount - 1) / 2);
                    if (userTrackIdx > 5) userTrackIdx = 5;
                    userPct = (lapCount % 2 === 1) ? 50 : 100;
                    
                    if(lapCount >= 12) {
                        userTrackIdx = 5;
                        userPct = 100;
                    }
                }

                let userNode = document.getElementById('user-' + userTrackIdx);
                if(userNode) {
