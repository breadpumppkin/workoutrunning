<!DOCTYPE html>
<html lang="zh-CN">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
 <title>跑表 | 6公里直道竞技场</title>
 <style>
 body { font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 100vh; margin: 0; background-color: #000000; color: #ffffff; padding: 15px 20px; box-sizing: border-box; user-select: none; }
 #status-bar { font-size: 13px; padding: 4px 14px; border-radius: 20px; background: #1c1c1e; color: #a2a2a2; }
 .time-panel { width: 100%; display: flex; justify-content: space-around; text-align: center; }
 .time-box { flex: 1; }
 .label { font-size: 13px; color: #8e8e93; letter-spacing: 1px; margin-bottom: 2px; }
 .time-num { font-size: 42px; font-weight: bold; font-variant-numeric: tabular-nums; }
 #prediction-box { font-size: 15px; color: #ffffff; min-height: 40px; margin: 5px 0; line-height: 1.4; text-align: center; }
 .predict-highlight { color: #34c759; font-weight: bold; }
 .arena { width: 100%; flex: 1; display: flex; flex-direction: column; justify-content: space-around; padding: 10px 0; }
 .track-row { width: 100%; display: flex; flex-direction: column; position: relative; }
 .track-name { font-size: 11px; color: #8e8e93; margin-bottom: 18px; display: flex; justify-content: space-between; }
 .track-rail { position: relative; width: 100%; height: 4px; background: #2c2c2e; border-radius: 2px; }
 .mid-mark { position: absolute; left: 50%; top: -3px; width: 2px; height: 10px; background: #444; }
 .avatar { position: absolute; top: -20px; font-size: 20px; z-index: 10; transform: scaleX(-1) translateX(50%); }
 .pacer-av { color: #ff9500; }
 .user-av { color: #34c759; font-weight: bold; transition: left 0.25s ease; }
 .controls { width: 100%; display: flex; flex-direction: column; gap: 10px; }
 .btn { width: 100%; border: none; border-radius: 16px; font-weight: bold; color: white; cursor: pointer; text-align: center; }
 .btn-hit { padding: 22px 0; font-size: 22px; background-color: #34c759; box-shadow: 0 4px 15px rgba(52,199,89,0.3); }
 .btn-hit:active { transform: scale(0.98); }
 .btn-group { display: flex; gap: 15px; }
 .btn-side { padding: 14px 0; font-size: 16px; background-color: #1c1c1e; }
 #startBtn { color: #34c759; border: 1px solid #34c759; }
 #resetBtn { color: #8e8e93; }
 </style>
</head>
<body>
 <div id="status-bar">⏳ 待机中</div>
 <div class="time-panel">
 <div class="time-box">
 <div class="label">已跑时间</div>
 <div id="total-time" class="time-num">00:00</div>
 </div>
 <div class="time-box">
 <div class="label">预计总用时</div>
 <div id="remaining-time" class="time-num">--:--</div>
 </div>
 </div>
 <div id="prediction-box">请点击下方“开始跑步”按钮</div>
 
 <div class="arena">
 <div class="track-row">
 <div class="track-name"><span>第 1 公里</span><span>0k - 1k</span></div>
 <div class="track-rail"><div class="mid-mark"></div><div id="pacer-0" class="avatar pacer-av" style="left:0%; display:block;">🏎️</div><div id="user-0" class="avatar user-av" style="left:0%; display:block;">🏃‍♂️</div></div>
 </div>
 <div class="track-row">
 <div class="track-name"><span>第 2 公里</span><span>1k - 2k</span></div>
 <div class="track-rail"><div class="mid-mark"></div><div id="pacer-1" class="avatar pacer-av" style="left:0%; display:none;">🏎️</div><div id="user-1" class="avatar user-av" style="left:0%; display:none;">🏃‍♂️</div></div>
 </div>
 <div class="track-row">
 <div class="track-name"><span>第 3 公里</span><span>2k - 3k</span></div>
 <div class="track-rail"><div class="mid-mark"></div><div id="pacer-2" class="avatar pacer-av" style="left:0%; display:none;">🏎️</div><div id="user-2" class="avatar user-av" style="left:0%; display:none;">🏃‍♂️</div></div>
 </div>
 <div class="track-row">
 <div class="track-name"><span>第 4 公里</span><span>3k - 4k</span></div>
 <div class="track-rail"><div class="mid-mark"></div><div id="pacer-3" class="avatar pacer-av" style="left:0%; display:none;">🏎️</div><div id="user-3" class="avatar user-av" style="left:0%; display:none;">🏃‍♂️</div></div>
 </div>
 <div class="track-row">
 <div class="track-name"><span>第 5 公里</span><span>4k - 5k</span></div>
 <div class="track-rail"><div class="mid-mark"></div><div id="pacer-4" class="avatar pacer-av" style="left:0%; display:none;">🏎️</div><div id="user-4" class="avatar user-av" style="left:0%; display:none;">🏃‍♂️</div></div>
 </div>
 <div class="track-row">
 <div class="track-name"><span>第 6 公里 (冲刺)</span><span>5k - 6k</span></div>
 <div class="track-rail"><div class="mid-mark"></div><div id="pacer-5" class="avatar pacer-av" style="left:0%; display:none;">🏎️</div><div id="user-5" class="avatar user-av" style="left:0%; display:none;">🏃‍♂️</div></div>
 </div>
 </div>
 
 <div class="controls">
 <button class="btn btn-hit" id="lapBtn" onclick="handleLapClick()" style="display:none;">🏃‍♂️ 到了！打卡下一个500米</button>
 <div class="btn-group">
 <button class="btn btn-side" id="resetBtn" onclick="handleResetClick()">清零</button>
 <button class="btn btn-side" id="startBtn" onclick="handleStartClick()">开始跑步</button>
 </div>
 </div>

 <script>
 let startTime = 0, elapsedTime = 0, timerInterval = null, isRunning = false;
 let lapCount = 0;
 const TOTAL_KM = 6;
 const TARGET_SECONDS = 35 * 60; 
 const TIME_PER_KM = TARGET_SECONDS / TOTAL_KM; 
 
 const timeEl = document.getElementById('total-time');
 const remainingEl = document.getElementById('remaining-time');
 const startBtn = document.getElementById('startBtn');
 const lapBtn = document.getElementById('lapBtn');
 const predictionBox = document.getElementById('prediction-box');
 const statusBar = document.getElementById('status-bar');

 function hideAllAvatars() {
 for(let i=0; i<6; i++) {
 document.getElementById('pacer-' + i).style.display = 'none';
 document.getElementById('user-' + i).style.display = 'none';
 }
 }

 function renderAvatars() {
 hideAllAvatars();
 let elapsedSec = elapsedTime / 1000;
 
 let pacerTrackIdx = Math.floor(elapsedSec / TIME_PER_KM);
 if (pacerTrackIdx < 0) pacerTrackIdx = 0;
 if (pacerTrackIdx > 5) pacerTrackIdx = 5;
 let pacerTrackSec = elapsedSec - (pacerTrackIdx * TIME_PER_KM);
 let pacerPct = (pacerTrackSec / TIME_PER_KM) * 100;
 if (elapsedSec >= TARGET_SECONDS) pacerPct = 100;
 let pacerNode = document.getElementById('pacer-' + pacerTrackIdx);
 if(pacerNode) {
 pacerNode.style.left = pacerPct + '%';
 pacerNode.style.display = 'block';
 }
 
 let userTrackIdx = 0;
 let userPct = 0;
 if (lapCount > 0) {
 userTrackIdx = Math.floor((lapCount - 1) / 2);
 if (userTrackIdx > 5) userTrackIdx = 5;
 userPct = (lapCount % 2 === 1) ? 50 : 100;
 }
 let userNode = document.getElementById('user-' + userTrackIdx);
 if(userNode) {
 userNode.style.left = userPct + '%';
 userNode.style.display = 'block';
 }
 }

 function formatTimeDisplay(seconds) {
 let m = Math.floor(seconds / 60).toString().padStart(2, '0');
 let s = Math.floor(seconds % 60).toString().padStart(2, '0');
 return m + ":" + s;
 }

 // 🌟 100% 严格纠正后的公式实现函数 🌟
 function triggerLapCalculation() {
 if (lapCount === 0) {
 predictionBox.innerText = "已开跑！通过500米或1公里时点击打卡";
 remainingEl.innerText = "--:--";
 return;
 }

 // A. 目前跑的时间（转化为小时，方便计算公里/小时）
 let currentHours = (elapsedTime / 1000) / 3600; 
 // B. 目前跑的距离（公里）
 let currentDistance = lapCount * 0.5; 
 
 // 1. 【公式第一步】目前跑的平均速度 = 目前跑的距离 / 目前跑的时间 (单位: 公里/小时)
 let currentAvgSpeed = currentDistance / currentHours;
 
 // 2. 【公式第二步】完成6公里剩下的距离
 let remainingDistance = TOTAL_KM - currentDistance;
 
 // 3. 【公式第三步】完成6公里剩下的距离 除以 目前跑的平均速度 (得到剩下的时间，单位: 小时)
 let remainingTimeHours = remainingDistance / currentAvgSpeed;
 
 // 4. 【公式第四步】预计总用时(小时) = 剩下的时间 + 目前跑的时间
 let predictedTotalHours = remainingTimeHours + currentHours;
 
 // 5. 将计算出的总用时从小时转换回秒，用来漂亮地显示在屏幕上
 let predictedTotalSeconds = predictedTotalHours * 3600;

 // 为了给跑友更直观的速度感，把“公里/小时”也同时转换成操场上更常用的“配速(分'秒'')/每公里”展示在下方
 let secondsPerKm = (elapsedTime / 1000) / currentDistance;
 let paceM = Math.floor(secondsPerKm / 60);
 let paceS = Math.floor(secondsPerKm % 60).toString().padStart(2, '0');

 // 刷新UI
 remainingEl.innerText = formatTimeDisplay(predictedTotalSeconds);
 predictionBox.innerHTML = "目前平均速度: <span class='predict-highlight'>" + currentAvgSpeed.toFixed(2) + " km/h</span> (" + paceM + "'" + paceS + "''/km)";
 }

 function handleStartClick() {
 if (!isRunning) {
 isRunning = true;
 startBtn.innerText = "暂停跑步";
 lapBtn.style.display = "block";
 statusBar.innerText = "⏳ 计时中";
 
 startTime = Date.now() - elapsedTime;
 timerInterval = setInterval(() => {
 elapsedTime = Date.now() - startTime;
 let totalSec = Math.floor(elapsedTime / 1000);
 timeEl.innerText = formatTimeDisplay(totalSec);
 renderAvatars();
 }, 250); 
 } else {
 isRunning = false;
 startBtn.innerText = "继续跑步";
 statusBar.innerText = "⏸️ 已暂停";
 if (timerInterval) {
 clearInterval(timerInterval);
 timerInterval = null;
 }
 }
 }

 function handleLapClick() {
 if (!isRunning) return;
 lapCount++;
 renderAvatars();
 
 // 🌟 1000米计算一次：每当打卡次数是双数（0.5k*2=1k, 0.5k*4=2k...）时才执行计算
 if (lapCount % 2 === 0) {
 triggerLapCalculation();
 }
 
 if (lapCount >= 12) {
 isRunning = false;
 if (timerInterval) {
 clearInterval(timerInterval);
 timerInterval = null;
 }
 startBtn.style.display = "none";
 lapBtn.style.display = "none";
 statusBar.innerText = "🏁 完赛！";
 } else {
 let currentDistText = (lapCount * 0.5) + " km";
 statusBar.innerText = "⏱️ 打卡成功 (当前已确认距离: " + currentDistText + ")";
 }
 }

 function handleResetClick() {
 isRunning = false;
 if (timerInterval) {
 clearInterval(timerInterval);
 timerInterval = null;
 }
 elapsedTime = 0;
 lapCount = 0;
 timeEl.innerText = "00:00";
 remainingEl.innerText = "--:--";
 predictionBox.innerText = "请点击下方“开始跑步”按钮";
 statusBar.innerText = "⏳ 待机中";
 startBtn.innerText = "开始跑步";
 startBtn.style.display = "block";
 lapBtn.style.display = "none";
 renderAvatars();
 }
 </script>
</body>
</html>
