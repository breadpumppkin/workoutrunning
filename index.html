<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🏃‍♂️ 6公里双轨道跑表</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            margin: 0;
            background-color: #000000;
            color: #ffffff;
            padding: 20px;
            box-sizing: border-box;
        }
        #status-bar { font-size: 13px; padding: 5px 14px; border-radius: 20px; background: #1c1c1e; color: #a2a2a2; }
        .time-box { text-align: center; }
        #total-time { font-size: 75px; font-weight: bold; font-variant-numeric: tabular-nums; }
        #prediction-box { font-size: 18px; color: #34c759; margin: 15px 0; min-height: 40px; text-align: center; }
        
        /* 赛道区域 */
        .arena { width: 100%; background: #1c1c1e; padding: 15px; border-radius: 12px; box-sizing: border-box; }
        .track { position: relative; margin: 25px 0; height: 6px; background: #2c2c2e; border-radius: 3px; }
        .track-title { font-size: 12px; color: #8e8e93; display: flex; justify-content: space-between; margin-bottom: 5px; }
        .avatar { position: absolute; top: -22px; font-size: 20px; transform: translateX(-50%); }
        #user-runner { transition: left 0.2s ease; }
        .scale { display: flex; justify-content: space-between; font-size: 10px; color: #444; margin-top: 5px; }

        /* 按钮面板 */
        .controls { width: 100%; display: flex; flex-direction: column; gap: 10px; }
        .btn { width: 100%; border: none; border-radius: 12px; font-weight: bold; color: white; cursor: pointer; }
        .btn-hit { padding: 22px 0; font-size: 22px; background-color: #34c759; }
        .btn-hit:active { opacity: 0.8; }
        .btn-group { display: flex; gap: 10px; }
        .btn-side { padding: 14px 0; font-size: 16px; background-color: #2c2c2e; }
        #startBtn { color: #34c759; border: 1px solid #34c759; }
        video { position: absolute; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; }
    </style>
</head>
<body>

    <div id="status-bar">⏳ 待机中</div>

    <div class="time-box">
        <div style="font-size:14px;color:#8e8e93">已跑步时间</div>
        <div id="total-time">00:00</div>
        <div id="prediction-box">点击下方“开始跑步”按钮启动</div>
    </div>

    <!-- 跑道 -->
    <div class="arena">
        <div class="track">
            <div class="track-title"><span>🤖 赛道一：35分目标 (匀速流)</span><span id="pacer-km">0.00 km</span></div>
            <div id="pacer" class="avatar" style="left: 0%;">🤖</div>
            <div class="scale"><span>0k</span><span>6k</span></div>
        </div>
        <div class="track">
            <div class="track-title"><span>🏃‍♂️ 赛道二：你的实际进度 (手动Reset)</span><span id="user-km">0.0 km</span></div>
            <div id="user-runner" class="avatar" style="left: 0%;">🏃‍♂️</div>
            <div class="scale"><span>0k</span><span>6k</span></div>
        </div>
    </div>

    <!-- 按钮组件 -->
    <div class="controls">
        <button class="btn btn-hit" id="lapBtn" onclick="handleLapClick()" style="display:none;">🏃‍♂️ 到了！打卡下一个500米</button>
        <div class="btn-group">
            <button class="btn btn-side" onclick="handleResetClick()">清零</button>
            <button class="btn btn-side" id="startBtn" onclick="handleStartClick()">开始跑步</button>
        </div>
    </div>

    <!-- 强行不锁屏所必需的静音视频轨道 -->
    <video id="hiddenVideo" loop playsinline muted>
        <source src="data:video/mp4;base64,AAAAIGZ0eXBtcDQyAAAAAG1wNDJpc29tYXZjMQAAAzphbW9vdgAAAGxtdmhkAAAAAMw1zXzMNc18AAAD6AAAA+gBAAEAAAEAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACYXRyYWsAAABjdGtoZAAAAAMw1zXzMNc18AAAAQAAAAAAAAA+gAAAAAABAAAAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAGW1kaWEAAABcbWRoZAAAAAMw1zXzMNc18AAAQAAAAEAAAQAAAAABVjdGxyAAAAAG5ibG9ndmlkZW9Ac29ueS5jb20AAAAAAG9taW5mAAAAFHZtaGQKAAAAAQAAAAAAAAAAAAAAJGRpbmYAAAAcdXVyZAAAAA1yZWYIAAAAAW1wNDUAAAAsc3RibAAAAGBzdHNkAAAAAAAAAAEAAAAsYXZjMQAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAQABAAEsAAAAwAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABjL2F2Y0MBQsAr/+EAFWd3wK9gUBlBwEBAgMDoAAB9AAgAAADpGBgYgAALuB94uSgAAAACHYm9keQAAAIdmcmZtAAAAAEMwMDEwMDBmMWYxZjFmMWYxZjFmMWYxZjFmMWYxZjFmMWYxZjFmMWYxZjFmMWYxZjFmMWYxZjFmMWYxZjFmMWYxZjFmMWYxZjFmMWYxZjFmMWYxZjFmMWYxZjFmMWYxZjFmMWYxZjFmMWYxZjFmMWYxZjFmMWYxZjFmMWYAAAALdWRhdAAAAAxtZXRhAAAAAAAAACFoZGxyAAAAAG1kaXJhcHBsAAAAAAAAAAAAAAAAbWxzdAAAAA9hbG9nMDBmMWYxZjFmMQAAADxtZGF0AAAAFmZyZm0AAAAAQzAwMTAwMGYxZjFmMWY=" type="video/mp4">
    </video>

    <script>
        let startTime = 0, elapsedTime = 0, timerInterval = null, isRunning = false;
        let lapCount = 0, lastLapTime = 0;
        const TARGET_SECONDS = 35 * 60;

        const timeEl = document.getElementById('total-time');
        const startBtn = document.getElementById('startBtn');
        const lapBtn = document.getElementById('lapBtn');
        const predictionBox = document.getElementById('prediction-box');
        const statusBar = document.getElementById('status-bar');
        const videoEl = document.getElementById('hiddenVideo');
        const pacerEl = document.getElementById('pacer');
        const pacerKm = document.getElementById('pacer-km');
        const userEl = document.getElementById('user-runner');
        const userKm = document.getElementById('user-km');

        function handleStartClick() {
            if (!isRunning) {
                // 解锁系统防熄屏
                try { videoEl.play(); statusBar.innerText = "🟢 屏幕常亮中"; } catch(e){}
                if ('wakeLock' in navigator) { navigator.wakeLock.request('screen').catch(e=>{}); }

                startTime = Date.now() - elapsedTime;
                timerInterval = setInterval(() => {
                    elapsedTime = Date.now() - startTime;
                    
                    // 刷新时钟
                    let m = Math.floor(elapsedTime / 60000).toString().padStart(2, '0');
                    let s = Math.floor((elapsedTime % 60000) / 1000).toString().padStart(2, '0');
                    timeEl.innerText = `${m}:${s}`;
                    
                    // 轨道一机器人挪动
                    let seconds = elapsedTime / 1000;
                    let pct = Math.min((seconds / TARGET_SECONDS) * 100, 100);
                    pacerEl.style.left = pct + '%';
                    pacerKm.innerText = Math.min(((seconds / TARGET_SECONDS) * 6), 6).toFixed(2) + ' km';
                }, 200);

                isRunning = true;
                startBtn.innerText = "暂停";
                lapBtn.style.display = "block";
                if(lapCount === 0) predictionBox.innerText = "每到跑步机500米，点击绿色大键记录";
            } else {
                clearInterval(timerInterval);
                try { videoEl.pause(); } catch(e){}
                isRunning = false;
                startBtn.innerText = "恢复";
            }
        }

        function handleLapClick() {
            if (!isRunning) return;
            lapCount++;
            if (lapCount > 12) lapCount = 12;

            lastLapTime = elapsedTime;
            let km = (lapCount * 0.5).toFixed(1);

            // 轨道二闪现推进
            userEl.style.left = ((lapCount / 12) * 100) + '%';
            userKm.innerText = km + ' km';

            // 预测均速
            if (lapCount >= 12) {
                predictionBox.innerText = "🎉 6公里完成！";
            } else {
                let avg = elapsedTime / lapCount;
                let finalMs = elapsedTime + (avg * (12 - lapCount));
